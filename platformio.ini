; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = telemetry_node, gateway_node

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Ampliamos la memoria pero con soporte para OTA (min_spiffs divide la memoria en 2 apps grandes)
board_build.partitions = min_spiffs.csv

; Activamos el USB Serial del ESP32-S3 por si no imprime nada en consola
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=0

lib_deps = 
	sandeepmistry/LoRa@^0.8.0
	bblanchon/ArduinoJson@^6.21.5

[env:telemetry_node]
build_src_filter = +<*> -<gateway.cpp>
; IMPORTANTE: Descomenta las siguientes 2 lineas y pon el puerto COM real
; de tu placa telemetry para evitar flashear la placa equivocada.
upload_port = COM18
monitor_port = COM18
lib_deps = 
	${env.lib_deps}

[env:gateway_node]
build_src_filter = +<*> -<main.cpp>
; IMPORTANTE: Descomenta las siguientes 2 lineas y pon el puerto COM real
; de tu placa gateway para evitar flashear la placa equivocada.
upload_port = COM19
monitor_port = COM19
lib_deps = 
	${env.lib_deps}
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.14.5

[env:gateway_v2_ota]
build_src_filter = +<../gateway_v2_ota.cpp> +<*> -<main.cpp> -<gateway.cpp>
upload_port = COM19
monitor_port = COM19
lib_deps = 
	${env.lib_deps}
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.14.5
