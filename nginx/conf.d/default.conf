server {
    listen 8443 ssl;
    server_name localhost;

    # Certificados del Servidor
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Configuración mTLS (Zero Trust)
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # Opciones de seguridad SSL - Solo TLS 1.2 para compatibilidad con ESP32 mbedTLS
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    error_log /var/log/nginx/error.log info;
    access_log /var/log/nginx/access.log;

    location / {
        proxy_pass http://orion:1026;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN $ssl_client_s_dn;
    }
}

# Dashboard Web — sirve archivos estáticos y proxea la API de Orion
server {
    listen 3000;
    server_name localhost;

    # Servir el dashboard estático
    root /usr/share/nginx/html;
    index index.html;

    # Proxy a Orion API para evitar CORS
    location /v2/ {
        proxy_pass http://orion:1026/v2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }
}
